<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <title>Система коммуникации УСЗН</title>
  <style>
    :root {
      --white: #f7f9ff;
      --soft: #c9d3e6;
      --blue: #5b7cff;
      --cyan: #54d2c4;
      --coral: #ff776f;
      --amber: #f5bc5b;
      --panel: rgba(18, 30, 53, 0.78);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      overflow: hidden;
      background: #10213b;
      font-family: Arial, "Ubuntu Sans", sans-serif;
    }

    .slide {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      color: var(--white);
      background-image: url("../assets/slide-01-many-windows.png");
      background-size: cover;
      background-position: center;
    }

    .slide::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(10, 27, 51, 0.22) 0%, rgba(10, 27, 51, 0.04) 49%, rgba(10, 27, 51, 0) 70%),
        linear-gradient(0deg, rgba(8, 20, 39, 0.38) 0%, rgba(8, 20, 39, 0) 35%);
    }

    .accent {
      position: absolute;
      left: 0;
      top: 0;
      width: 14px;
      height: 1080px;
      background: linear-gradient(180deg, var(--blue), var(--cyan));
    }

    .content {
      position: absolute;
      left: 88px;
      top: 82px;
      width: 765px;
    }

    .label {
      display: inline-flex;
      align-items: center;
      height: 42px;
      padding: 0 22px;
      border: 1px solid rgba(84, 210, 196, 0.5);
      border-radius: 21px;
      color: #9ce9df;
      background: rgba(18, 58, 67, 0.54);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 1.7px;
      text-transform: uppercase;
    }

    h1 {
      width: 720px;
      margin: 60px 0 0;
      font-size: 76px;
      line-height: 0.98;
      letter-spacing: -2.8px;
      font-weight: 800;
      text-wrap: balance;
      text-shadow: 0 3px 16px rgba(4, 14, 29, 0.26);
    }

    .subtitle {
      width: 690px;
      margin-top: 42px;
      color: #dce5f6;
      font-size: 34px;
      line-height: 1.2;
      font-weight: 650;
    }

    .problems {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 630px;
      margin-top: 46px;
    }

    .problem {
      display: flex;
      align-items: center;
      min-height: 50px;
      width: max-content;
      max-width: 630px;
      padding: 8px 21px 8px 12px;
      border: 1px solid rgba(202, 214, 234, 0.18);
      border-radius: 25px;
      background: rgba(20, 35, 61, 0.68);
      backdrop-filter: blur(8px);
      color: #eef3fb;
      font-size: 22px;
      font-weight: 650;
      box-shadow: 0 10px 26px rgba(5, 14, 29, 0.14);
    }

    .dot {
      width: 30px;
      height: 30px;
      margin-right: 13px;
      border-radius: 50%;
      flex: 0 0 auto;
      box-shadow: inset 0 0 0 8px rgba(255, 255, 255, 0.12);
    }

    .dot.coral { background: var(--coral); }
    .dot.amber { background: var(--amber); }
    .dot.blue { background: var(--blue); }

    .caption {
      position: absolute;
      left: 88px;
      bottom: 74px;
      width: 1050px;
      min-height: 86px;
      display: flex;
      align-items: center;
      padding: 18px 30px;
      border-left: 5px solid var(--cyan);
      border-radius: 0 18px 18px 0;
      background: var(--panel);
      box-shadow: 0 18px 48px rgba(5, 14, 29, 0.18);
      backdrop-filter: blur(10px);
      color: #dbe5f4;
      font-size: 25px;
      line-height: 1.28;
      font-weight: 500;
    }

    .caption strong { color: var(--white); }

    .slide-no {
      position: absolute;
      right: 62px;
      bottom: 45px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <main class="slide" aria-label="Первый слайд презентации">
    <div class="accent"></div>

    <section class="content">
      <div class="label">Предложение о внедрении</div>
      <h1>Система коммуникации УСЗН</h1>
      <div class="subtitle">От множества окон — к единому рабочему пространству</div>

      <div class="problems">
        <div class="problem"><span class="dot coral"></span>Сообщения теряются среди окон</div>
        <div class="problem"><span class="dot amber"></span>Нет удобных групповых обсуждений</div>
        <div class="problem"><span class="dot blue"></span>Уведомления легко пропустить</div>
      </div>
    </section>

    <div class="caption">
      <strong>Текстовый обмен уже есть.</strong>&nbsp; Теперь важно сделать его удобным, групповым и заметным.
    </div>

    <div class="slide-no">01</div>
  </main>
</body>
</html>
