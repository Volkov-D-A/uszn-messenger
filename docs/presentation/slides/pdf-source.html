<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Система коммуникации УСЗН</title>
  <style>
    @page {
      size: 13.333333in 7.5in;
      margin: 0;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: #09182d;
    }

    .page {
      width: 13.333333in;
      height: 7.5in;
      margin: 0;
      overflow: hidden;
      break-after: page;
      page-break-after: always;
    }

    .page:last-child {
      break-after: auto;
      page-break-after: auto;
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <section class="page"><img src="01-title.png" alt="Слайд 1"></section>
  <section class="page"><img src="02-solution.png" alt="Слайд 2"></section>
  <section class="page"><img src="03-capabilities.png" alt="Слайд 3"></section>
  <section class="page"><img src="04-workspace.png" alt="Слайд 4"></section>
  <section class="page"><img src="05-results.png" alt="Слайд 5"></section>
  <section class="page"><img src="06-attention.png" alt="Слайд 6"></section>
  <section class="page"><img src="07-files-search.png" alt="Слайд 7"></section>
  <section class="page"><img src="08-design.png" alt="Слайд 8"></section>
  <section class="page"><img src="09-results.png" alt="Слайд 9"></section>
</body>
</html>
